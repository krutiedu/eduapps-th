<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="supported-color-schemes" content="light">
<meta name="theme-color" content="#F6F4EF">
<title>กระดานครู · KruBoard</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=Sarabun:wght@400;600;700&display=swap');
  :root{
    color-scheme: light only;
    --paper:#F6F4EF;--card:#FFFFFF;--ink:#23201B;--ink-soft:#6B655C;--line:#E5E0D6;
    --chalk:#F4A6C0;--chalk-deep:#D87FA0;--marker:#E8643C;--marker-soft:#FBE7DF;
    --star:#E5A516;--ok:#2E9E6B;
    --shadow:0 1px 2px rgba(35,32,27,.05),0 8px 24px rgba(35,32,27,.06);
    --shadow-lg:0 12px 40px rgba(35,32,27,.14);--r:18px;--r-sm:12px;
  }
  /* บังคับ light mode แม้ผู้ใช้เปิด iOS Dark Mode */
  html{color-scheme: light only !important;}
  @media (prefers-color-scheme: dark) {
    :root{
      color-scheme: light only;
      --paper:#F6F4EF;--card:#FFFFFF;--ink:#23201B;--ink-soft:#6B655C;--line:#E5E0D6;
    }
    html, body{background:#F6F4EF !important;color:#23201B !important;}
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{font-family:'IBM Plex Sans Thai','Sarabun',system-ui,sans-serif;background:var(--paper);color:var(--ink);line-height:1.55;-webkit-font-smoothing:antialiased;overscroll-behavior-y:none}
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
  input,select,textarea{font-family:inherit;font-size:16px}
  .hidden{display:none!important}
  .wrap{max-width:1080px;margin:0 auto;padding:0 16px}
  .topbar{position:sticky;top:0;z-index:40;background:rgba(246,244,239,.85);backdrop-filter:saturate(180%) blur(12px);border-bottom:1px solid var(--line)}
  .topbar .wrap{display:flex;align-items:center;gap:12px;height:60px}
  .brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:18px;letter-spacing:-.01em}
  .brand .logo{width:30px;height:30px;border-radius:9px;background:var(--chalk);display:grid;place-items:center;color:#fff;font-weight:700;font-size:15px;box-shadow:inset 0 0 0 2px rgba(255,255,255,.18);transform:rotate(-4deg)}
  .brand small{color:var(--ink-soft);font-weight:500;font-size:12.5px;margin-left:2px}
  .who{font-size:13px;color:var(--ink-soft);display:flex;align-items:center;gap:8px;margin-left:auto}
  .who .dot{width:8px;height:8px;border-radius:50%;background:var(--ok)}
  .who button{font-size:13px;color:var(--marker);font-weight:700;background:transparent;border:none;padding:6px 10px;cursor:pointer;border-radius:8px;transition:.15s}
  .who button:hover{background:rgba(232,100,60,.1)}
  .who button:active{transform:scale(.96)}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 18px;border-radius:12px;font-weight:600;font-size:15px;background:var(--card);border:1px solid var(--line);color:var(--ink);transition:transform .08s,box-shadow .15s,background .15s}
  .btn:active{transform:scale(.97)}
  .btn.primary{background:var(--chalk);color:#fff;border-color:transparent;box-shadow:0 6px 16px rgba(244,166,192,.28)}
  .btn.primary:active{background:var(--chalk-deep)}
  .btn.ghost{background:transparent}.btn.sm{padding:8px 13px;font-size:13.5px;border-radius:10px}.btn.block{width:100%}
  .btn:disabled{opacity:.5;pointer-events:none}
  .hero{padding:54px 0 30px;text-align:center}
  .hero h1{font-size:clamp(30px,7vw,46px);line-height:1.08;letter-spacing:-.02em;margin:0 0 14px;font-weight:700}
  .hero h1 .hl{color:var(--chalk);position:relative;white-space:nowrap}
  .hero h1 .hl::after{content:"";position:absolute;left:-2px;right:-2px;bottom:4px;height:10px;background:rgba(244,166,192,.16);z-index:-1;border-radius:3px}
  .hero p{max-width:520px;margin:0 auto;color:var(--ink-soft);font-size:17px}
  .roles{display:grid;grid-template-columns:1fr 1fr;gap:14px;max-width:560px;margin:30px auto 0}
  .role{text-align:left;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:20px 18px;box-shadow:var(--shadow);transition:transform .12s,box-shadow .15s}
  .role:active{transform:translateY(1px)}
  .role .ic{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font-size:21px;margin-bottom:12px}
  .role.t .ic{background:var(--chalk);color:#fff}.role.s .ic{background:var(--marker-soft);color:var(--marker)}
  .role h3{margin:0 0 4px;font-size:18px}.role span{font-size:13.5px;color:var(--ink-soft)}
  @media(max-width:520px){.roles{grid-template-columns:1fr}}
  .page{padding:24px 0 100px;animation:fade .25s ease}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .phead{display:flex;align-items:center;gap:12px;margin-bottom:20px}
  .phead h2{margin:0;font-size:23px;letter-spacing:-.01em}.phead .sub{color:var(--ink-soft);font-size:14px}
  .back{font-size:14px;color:var(--ink-soft);display:inline-flex;gap:5px;align-items:center;padding:6px 0}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
  .bcard{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:0;box-shadow:var(--shadow);text-align:left;position:relative;overflow:hidden;transition:transform .12s,box-shadow .15s}
  .bcard:active{transform:translateY(1px)}
  .bcard-open{display:block;width:100%;background:none;border:none;padding:18px;text-align:left;cursor:pointer;color:inherit;font:inherit}
  .bcard-acts{position:absolute;top:8px;right:8px;display:flex;gap:4px;z-index:3}
  .bcard .tag{display:inline-block;font-size:12px;font-weight:600;color:var(--chalk-deep);background:rgba(244,166,192,.1);padding:3px 9px;border-radius:20px;margin-bottom:10px}
  .bcard h3{margin:0 0 4px;font-size:17px;line-height:1.3}.bcard .meta{font-size:13px;color:var(--ink-soft)}
  .bcard .prog{margin-top:14px;height:7px;border-radius:10px;background:var(--line);overflow:hidden}
  .bcard .prog>i{display:block;height:100%;background:var(--chalk);border-radius:10px;transition:width .4s}
  .bcard .pnum{font-size:12.5px;color:var(--ink-soft);margin-top:7px;display:flex;justify-content:space-between}
  .newcard{border:1.5px dashed var(--line);background:transparent;border-radius:var(--r);display:grid;place-items:center;min-height:150px;color:var(--ink-soft);font-weight:600;gap:8px;transition:border-color .15s,color .15s}
  .newcard:hover{border-color:var(--chalk);color:var(--chalk)}
  .newcard .plus{width:38px;height:38px;border-radius:50%;background:var(--card);border:1px solid var(--line);display:grid;place-items:center;font-size:22px}
  .empty{text-align:center;padding:50px 20px;color:var(--ink-soft)}.empty .big{font-size:40px;margin-bottom:8px}
  .field{margin-bottom:16px}.field label{display:block;font-size:13.5px;font-weight:600;margin-bottom:6px}
  .field input,.field select,.field textarea{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);transition:border-color .15s,box-shadow .15s}
  .field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--chalk);box-shadow:0 0 0 3px rgba(244,166,192,.12)}
  .toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
  .toggle .lab{font-size:14px;font-weight:600}.toggle .lab small{display:block;font-weight:400;color:var(--ink-soft);font-size:12.5px;margin-top:2px}
  .sw{width:48px;height:28px;border-radius:20px;background:var(--line);position:relative;transition:background .2s;flex:none}
  .sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:left .2s}
  .sw.on{background:var(--chalk)}.sw.on::after{left:23px}
  .share{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:22px;text-align:center;box-shadow:var(--shadow)}
  .qrbox{width:188px;height:188px;margin:6px auto 16px;background:#fff;border-radius:14px;border:1px solid var(--line);display:grid;place-items:center;padding:12px}
  .qrbox img,.qrbox canvas{width:100%;height:100%}
  .linkrow{display:flex;gap:8px;margin-top:8px}
  .linkrow input{flex:1;font-size:13px;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--paper);color:var(--ink-soft)}
  .scard{max-width:460px;margin:0 auto}
  .stask{background:var(--chalk);color:#fff;border-radius:var(--r);padding:20px;margin-bottom:18px;box-shadow:0 8px 24px rgba(244,166,192,.25)}
  .stask .tag{font-size:12px;opacity:.85;font-weight:600}.stask h2{margin:4px 0 2px;font-size:22px}.stask .rm{font-size:13.5px;opacity:.9}
  /* แนบรูปหลายใบ — ตารางรูปที่เลือกไว้ + ปุ่มเลือกรูป */
  .shots{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px;margin-bottom:10px}
  .shot{position:relative;border-radius:10px;overflow:hidden;border:1px solid var(--line);background:var(--card)}
  .shot img{width:100%;aspect-ratio:3/4;object-fit:cover;display:block}
  .shot .rm{position:absolute;top:4px;right:4px;width:24px;height:24px;border-radius:50%;background:rgba(255,255,255,.94);border:1px solid rgba(0,0,0,.08);display:grid;place-items:center;font-size:12px;box-shadow:0 2px 6px rgba(0,0,0,.14)}
  .shot .rm:hover{background:var(--marker-soft);color:var(--marker)}
  .shot .ord{position:absolute;left:4px;bottom:4px;font-size:11px;font-weight:700;color:#fff;background:rgba(0,0,0,.55);padding:1px 7px;border-radius:20px}
  .pickrow{display:flex;gap:8px}
  .pickbtn{flex:1;border:1.5px dashed var(--line);border-radius:var(--r-sm);background:var(--card);padding:14px 10px;text-align:center;font-size:13.5px;font-weight:600;color:var(--ink-soft);cursor:pointer;transition:border-color .15s,color .15s;display:block}
  .pickbtn:hover{border-color:var(--chalk);color:var(--chalk)}
  .pickbtn .ic{display:block;font-size:22px;margin-bottom:4px}
  .pickrow.off{opacity:.45;pointer-events:none}
  .shotinfo{font-size:12.5px;color:var(--ink-soft);margin-top:8px;text-align:center}
  .shotinfo b{color:var(--ok)}
  .shotinfo .warn{display:block;margin-top:4px;color:var(--marker)}
  .modes{display:flex;flex-direction:column;gap:8px;margin-bottom:10px}
  .modebtn{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:1.5px solid var(--line);border-radius:var(--r-sm);background:var(--card);padding:11px 13px;color:var(--ink-soft);cursor:pointer;transition:border-color .15s,box-shadow .15s}
  .modebtn .t{flex:1;min-width:0}
  .modebtn b{display:block;font-size:14px;font-weight:700;color:var(--ink)}
  .modebtn span{display:block;font-size:11.5px;line-height:1.35;margin-top:1px}
  .modebtn .rec{font-style:normal;font-size:10.5px;font-weight:700;padding:1px 7px;border-radius:20px;border:1px solid var(--ok);color:var(--ok);margin-left:7px;white-space:nowrap}
  .modebtn .kb{flex:none;font-size:12.5px;font-weight:700;color:var(--ok)}
  .modebtn.on{border-color:var(--chalk-deep);box-shadow:inset 0 0 0 1px var(--chalk-deep)}
  .toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px;align-items:center}
  .seg{display:inline-flex;background:var(--card);border:1px solid var(--line);border-radius:11px;padding:3px;gap:2px}
  .seg button{padding:7px 13px;border-radius:8px;font-size:13.5px;font-weight:600;color:var(--ink-soft)}
  .seg button.on{background:var(--chalk);color:#fff}
  .mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
  .pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
  .pwork{background:var(--card);border:1px solid var(--line);border-radius:var(--r-sm);overflow:hidden;box-shadow:var(--shadow);transition:transform .12s,box-shadow .15s;text-align:left;padding:0;cursor:pointer}
  .pwork:active{transform:scale(.985)}
  .pwork img{width:100%;aspect-ratio:3/4;object-fit:cover;display:block;background:var(--line)}
  .pwork .pwlbl{padding:8px 10px;display:flex;align-items:center;justify-content:space-between;gap:6px}
  .pwork .pno{font-weight:700;font-size:14px}
  .pwork .pnm{font-size:12px;color:var(--ink-soft);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:90px}
  .work{background:var(--card);border:1px solid var(--line);border-radius:var(--r-sm);overflow:hidden;box-shadow:var(--shadow);position:relative;transition:transform .12s,box-shadow .15s}
  .work:active{transform:scale(.985)}
  .wopen{display:block;width:100%;background:none;border:none;padding:0;text-align:left;cursor:pointer;color:inherit;font:inherit}
  .work .thumb{width:100%;aspect-ratio:3/4;object-fit:cover;display:block;background:var(--line)}
  .wthumb{position:relative;display:block}
  .imgcount{position:absolute;left:6px;bottom:6px;font-size:11px;font-weight:700;color:#fff;background:rgba(0,0,0,.55);padding:2px 8px;border-radius:20px;pointer-events:none}
  .work .wfoot{padding:8px 10px;display:flex;align-items:center;justify-content:space-between;gap:6px}
  .work .wbtns{position:absolute;top:6px;right:6px;display:flex;gap:4px;z-index:3}
  .work .wbtn{width:28px;height:28px;border-radius:50%;background:rgba(255,255,255,.92);backdrop-filter:blur(6px);border:1px solid rgba(0,0,0,.08);display:grid;place-items:center;font-size:13px;cursor:pointer;box-shadow:0 2px 6px rgba(0,0,0,.12);transition:transform .1s}
  .work .wbtn:hover{transform:scale(1.08)}
  .work .wbtn.del:hover{background:#fee;color:var(--marker)}
  .work .no{font-weight:700;font-size:14px}.work .nm{font-size:12px;color:var(--ink-soft);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .badge{position:absolute;top:8px;right:8px;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:14px;color:#fff;box-shadow:0 2px 6px rgba(0,0,0,.2)}
  .badge.ok{background:var(--ok)}.badge.no{background:var(--marker)}.badge.star{background:var(--star)}
  .work .scorechip{font-size:12px;font-weight:700;color:var(--chalk-deep);background:rgba(244,166,192,.1);padding:2px 7px;border-radius:8px}
  .pending-ring{position:absolute;top:8px;left:8px;width:10px;height:10px;border-radius:50%;background:var(--marker);box-shadow:0 0 0 3px rgba(232,100,60,.2)}
  .viewer{position:fixed;inset:0;z-index:60;background:rgba(20,18,15,.96);display:flex;flex-direction:column;animation:fade .2s}
  .vtop{display:flex;align-items:center;gap:12px;padding:14px 16px;color:#fff;padding-top:max(14px,env(safe-area-inset-top))}
  .vtop .vname{font-weight:700;font-size:16px}.vtop .vsub{font-size:12.5px;opacity:.7}
  .vclose{margin-left:auto;width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.12);color:#fff;display:grid;place-items:center;font-size:18px}
  .vstage{flex:1;position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden;touch-action:none;min-height:0}
  .vstage .vimg-wrap{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;cursor:grab;padding:8px}
  .vstage .vimg-wrap.grabbing{cursor:grabbing}
  .vstage img{max-width:100%;max-height:100%;width:auto;height:auto;object-fit:contain;border-radius:8px;transition:transform .15s;transform-origin:center;user-select:none;-webkit-user-drag:none;pointer-events:none;display:block}
  .vstage.zoomed img{transition:none}
  .vzoom{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);display:flex;gap:6px;background:rgba(0,0,0,.55);backdrop-filter:blur(8px);padding:6px;border-radius:99px;z-index:3}
  .vzoom button{width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.15);color:#fff;display:grid;place-items:center;font-size:18px;font-weight:600}
  .vzoom button:hover{background:rgba(255,255,255,.25)}
  .vzoom .vzlabel{padding:0 12px;display:grid;place-items:center;color:#fff;font-size:13px;font-weight:600;min-width:54px}
  .varrow{position:absolute;top:50%;transform:translateY(-50%);width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.14);color:#fff;display:grid;place-items:center;font-size:22px;z-index:2}
  .varrow.l{left:10px}.varrow.r{right:10px}.varrow:disabled{opacity:.25}
  /* แถบเลือกรูปย่อย เมื่องานชิ้นนั้นมีหลายรูป */
  .vstrip{display:flex;gap:6px;padding:0 16px 10px;overflow-x:auto;flex:none;justify-content:center}
  .vstrip button{flex:none;width:50px;height:50px;border-radius:9px;overflow:hidden;border:2px solid transparent;opacity:.5;transition:.15s;padding:0}
  .vstrip button.on{border-color:var(--chalk);opacity:1}
  .vstrip img{width:100%;height:100%;object-fit:cover;display:block}
  .vmark{background:#fff;padding:14px 16px;padding-bottom:max(14px,env(safe-area-inset-bottom));border-radius:20px 20px 0 0}
  .stamps{display:flex;gap:10px;margin-bottom:12px}
  .stamp{flex:1;padding:12px;border-radius:13px;border:1.5px solid var(--line);font-weight:700;font-size:15px;display:flex;align-items:center;justify-content:center;gap:7px;background:var(--card);transition:.12s}
  .stamp.ok.on{background:var(--ok);color:#fff;border-color:transparent}
  .stamp.no.on{background:var(--marker);color:#fff;border-color:transparent}
  .stamp.star.on{background:var(--star);color:#fff;border-color:transparent}
  .markrow{display:flex;gap:10px;align-items:stretch}
  .markrow .sc{width:118px;flex:none}.markrow .sc input{text-align:center;font-weight:700;font-size:18px}
  .markrow textarea{flex:1;resize:none;height:50px;padding:9px 12px}
  .vsavebar{display:flex;gap:10px;margin-top:12px}
  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:20px}
  .stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:15px;text-align:center}
  .stat .v{font-size:26px;font-weight:700;letter-spacing:-.02em}.stat .k{font-size:12px;color:var(--ink-soft);margin-top:2px}
  .stat.accent .v{color:var(--chalk)}
  @media(max-width:520px){.stats{grid-template-columns:repeat(2,1fr)}}
  table{width:100%;border-collapse:collapse;background:var(--card);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow)}
  th,td{text-align:left;padding:11px 14px;font-size:14px;border-bottom:1px solid var(--line)}
  th{background:var(--paper);font-size:12.5px;color:var(--ink-soft);font-weight:600}
  tr:last-child td{border-bottom:none}
  .st-chip{font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:20px}
  .st-chip.done{background:rgba(46,158,107,.12);color:var(--ok)}.st-chip.wait{background:rgba(232,100,60,.12);color:var(--marker)}
  .result{max-width:460px;margin:0 auto;text-align:center}
  .rsheet{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow);margin-top:14px}
  .rsheet img{width:100%;display:block}
  .rsheet img+img{border-top:1px solid var(--line)}
  .rstamp{font-size:46px;padding:14px 0 4px}.rscore{font-size:34px;font-weight:700;color:var(--chalk)}
  .rcomment{background:var(--marker-soft);color:#8a3a22;border-radius:13px;padding:13px 15px;margin:14px;font-size:14.5px;text-align:left;position:relative}
  .rcomment::before{content:"ความเห็นจากครู";display:block;font-size:11px;font-weight:700;color:var(--marker);margin-bottom:4px}
  .toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:12px 20px;border-radius:30px;font-size:14px;font-weight:600;opacity:0;transition:.25s;z-index:90;box-shadow:var(--shadow-lg)}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .modal-bg{position:fixed;inset:0;background:rgba(20,18,15,.4);z-index:70;display:grid;place-items:center;padding:18px;animation:fade .2s}
  .modal{background:var(--card);border-radius:20px;padding:22px;max-width:420px;width:100%;box-shadow:var(--shadow-lg);max-height:90vh;overflow:auto}
  .modal h3{margin:0 0 16px;font-size:20px}
  .spin{width:34px;height:34px;border:3px solid var(--line);border-top-color:var(--chalk);border-radius:50%;animation:sp 1s linear infinite;margin:30px auto}
  @keyframes sp{to{transform:rotate(360deg)}}
</style>

<body>
<div class="topbar"><div class="wrap">
  <div class="brand"><span class="logo">ค</span><span>กระดานครู<small>KruBoard</small></span></div>
  <div id="whoami" class="who hidden"><span class="dot"></span><span id="whoTxt"></span><button onclick="signOut()">ออก</button></div>
</div></div>
<div id="app"></div>
<div class="toast" id="toast"></div>

<script>
/* ============================================================
   KruBoard · frontend (ต่อ API จริง · ระบบ user/password)
   ============================================================ */
const API = '/api/kb';
// จำนวนรูปสูงสุดต่อการส่ง 1 ครั้ง — ค่าจริงมาจาก backend (GET /board/:id → max_imgs)
// ตัวเลขนี้เป็นแค่ค่าสำรองกรณี API ไม่ส่งมา ถ้าจะเปลี่ยนเพดานจริงให้แก้ MAX_IMGS
// ในไฟล์ functions/api/kb/[[route]].js ที่เดียวพอ
let MAX_IMGS = 10;
// งานเก่าที่มีรูปเดียวจะไม่มี field imgs — เผื่อไว้ให้อ่านได้ทั้ง 2 แบบ
const subImgs = s => (s && s.imgs && s.imgs.length) ? s.imgs : (s && s.img ? [s.img] : []);

// session ค้างยาว — เก็บใน localStorage (ไม่ต้องล็อกอินบ่อย)
let _token = localStorage.getItem('kb_token') || null;
let _user  = localStorage.getItem('kb_user') || null;
let _name  = localStorage.getItem('kb_name') || null;

/* ---- api helpers ---- */
async function api(path, opts = {}) {
  const headers = opts.headers || {};
  if (_token && !opts.noAuth) headers['Authorization'] = 'Bearer ' + _token;
  if (opts.json) { headers['content-type'] = 'application/json'; opts.body = JSON.stringify(opts.json); }
  const r = await fetch(API + path, { ...opts, headers });
  if (r.status === 401 && !opts.noAuth) { signOut(); throw new Error('กรุณาเข้าสู่ระบบใหม่'); }
  const data = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(data.error || 'เกิดข้อผิดพลาด');
  return data;
}

/* ---- image compression (ของจริง) ----
   2 โหมด: มาตรฐาน (ใบงาน/ลายมือ — ปรับพื้นกระดาษให้ขาวเรียบ ไฟล์เล็กมาก)
   กับ งานศิลปะ (คงสีและเฉดทุกอย่าง ลดแค่ความละเอียดที่เกินจำเป็น)
   ปรับจูนตัวเลขทั้งหมดได้ที่ IMG_MODES ที่เดียว */
const IMG_MODES = {
  std:  { label:'มาตรฐาน', hint:'ลายมือจาง ดินสออ่อน หรือถ่ายในที่แสงน้อย',        maxW:1200, q:.80, paper:true,  autoGray:true  },
  lean: { label:'ประหยัด', hint:'ภาพถ่ายเอกสาร ตัวหนังสือชัด — กินพื้นที่น้อยที่สุด',
          rec:'แนะนำ',                                                             maxW:1200, q:.68, paper:true,  autoGray:true  },
  art:  { label:'งานศิลปะ', hint:'ภาพวาด งานสี ที่ต้องดูรายละเอียด', icon:'🎨 ',    maxW:1600, q:.88, paper:false, autoGray:false },
};
let _imgMode = 'std';   // ค่าเริ่มต้นต้องเป็น std เสมอ (รีเซ็ตทุกครั้งที่เปิดหน้าส่งงาน)

// WebP เล็กกว่า JPEG ~30% ที่ความชัดเท่ากัน แต่ต้องเช็คก่อนว่า browser รองรับ
// ถ้าไม่รองรับแล้วสั่ง toBlob('image/webp') browser จะเงียบ ๆ คืน PNG มาแทน ซึ่งใหญ่กว่ามาก
let _webpOK = null;
function webpOK(){
  if(_webpOK===null){
    const c=document.createElement('canvas');c.width=c.height=1;
    _webpOK=c.toDataURL('image/webp').indexOf('data:image/webp')===0;
  }
  return _webpOK;
}
const imgType = () => webpOK() ? 'image/webp' : 'image/jpeg';
const imgExt  = () => webpOK() ? 'webp' : 'jpg';

/* ทำให้พื้นกระดาษขาวเรียบ — ตัวนี้ทำให้ไฟล์เล็กลงมากที่สุด
   เพราะพื้นที่ส่วนใหญ่ของรูปใบงานคือกระดาษ ที่กล้องเก็บ noise + เงา + สีเหลืองจากหลอดไฟมาด้วย
   วิธี: หาระดับความสว่าง "ระดับกระดาษ" ของแต่ละช่องสี (เปอร์เซ็นไทล์ 92) แล้วดึงให้เป็น 255
   เป็นการคูณค่าล้วน ๆ ไม่มีการตัดโทนมืดทิ้ง → รอยดินสออ่อนไม่หาย แค่พื้นรอบ ๆ ขาวขึ้น
   แยกทำทีละช่องสี ทำให้สีเหลืองจากแสงหลอดไฟหายไปด้วย */
function paperWhite(d){
  const hist=[new Uint32Array(256),new Uint32Array(256),new Uint32Array(256)];
  const step=Math.max(4,Math.floor(d.length/4/40000)*4);   // สุ่มอ่านพอประมาณ ไม่ต้องไล่ทุกพิกเซล
  let n=0;
  for(let i=0;i<d.length;i+=step){hist[0][d[i]]++;hist[1][d[i+1]]++;hist[2][d[i+2]]++;n++}
  const lut=[];
  for(let ch=0;ch<3;ch++){
    let acc=0,hi=255;
    for(let v=0;v<256;v++){acc+=hist[ch][v];if(acc>=n*.92){hi=v;break}}
    // กันเคสถ่ายในที่มืดหรือพื้นไม่ใช่กระดาษ — ไม่ขยายเกิน 1.6 เท่า
    const scale=Math.min(255/Math.max(hi,1),1.6),t=new Uint8Array(256);
    for(let v=0;v<256;v++)t[v]=Math.min(255,Math.round(v*scale));
    lut.push(t);
  }
  for(let i=0;i<d.length;i+=4){d[i]=lut[0][d[i]];d[i+1]=lut[1][d[i+1]];d[i+2]=lut[2][d[i+2]]}
}

/* ถ้ารูปแทบไม่มีสีอยู่แล้ว (งานดินสอ/ปากกาดำ) ตัดสีทิ้ง — เล็กลงอีกโดยไม่เสียอะไร
   ถ้ามีสีจริง (ปากกาแดงของครู งานที่ระบายสี) จะไม่แตะเลย */
function maybeGray(d){
  const step=Math.max(4,Math.floor(d.length/4/20000)*4);
  let sat=0,n=0;
  for(let i=0;i<d.length;i+=step){
    const mx=Math.max(d[i],d[i+1],d[i+2]),mn=Math.min(d[i],d[i+1],d[i+2]);
    if(mx>24){sat+=(mx-mn)/mx;n++}
  }
  if(!n||sat/n>.10)return false;      // มีสีจริง — ไม่แปลง
  for(let i=0;i<d.length;i+=4){
    const y=(d[i]*299+d[i+1]*587+d[i+2]*114)/1000|0;
    d[i]=d[i+1]=d[i+2]=y;
  }
  return true;
}

function compress(file, mode = _imgMode) {
  const M = IMG_MODES[mode] || IMG_MODES.std;
  return new Promise((res, rej) => {
    const img = new Image();
    const src = URL.createObjectURL(file);
    img.onload = () => {
      URL.revokeObjectURL(src);
      let { width: w, height: h } = img;
      if (w > M.maxW) { h = Math.round(h * M.maxW / w); w = M.maxW; }
      const c = document.createElement('canvas'); c.width = w; c.height = h;
      const ctx = c.getContext('2d', { willReadFrequently: true });
      ctx.drawImage(img, 0, 0, w, h);
      if (M.paper || M.autoGray) {
        const id = ctx.getImageData(0, 0, w, h);
        if (M.paper) paperWhite(id.data);
        if (M.autoGray) maybeGray(id.data);
        ctx.putImageData(id, 0, 0);
      }
      c.toBlob(b => b ? res({ blob:b, kb:Math.round(b.size/1024) }) : rej(new Error('ย่อรูปไม่สำเร็จ ลองใหม่อีกครั้ง')),
               imgType(), M.q);
    };
    img.onerror = () => { URL.revokeObjectURL(src); rej(new Error('เปิดไฟล์รูปนี้ไม่ได้')); };
    img.src = src;
  });
}
const fmtKB = kb => kb >= 1024 ? (kb/1024).toFixed(1)+' MB' : kb+' KB';
// เดานามสกุลจาก URL ของรูป เพื่อตั้งชื่อไฟล์ตอนดาวน์โหลดให้ถูก (งานเก่าเป็น .jpg งานใหม่เป็น .webp)
const urlExt = u => { const m=/\.([a-z0-9]{3,4})(?:$|[?#])/i.exec(decodeURIComponent(u||'')); return m ? m[1].toLowerCase() : 'jpg'; };

/* ---- helpers ---- */
const $ = s => document.querySelector(s);
const app = $('#app');
const go = h => location.hash = h;
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(t._);t._=setTimeout(()=>t.classList.remove('show'),2400)}
function esc(s){return(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function setWho(t){const w=$('#whoami');if(t){w.classList.remove('hidden');$('#whoTxt').textContent=t}else w.classList.add('hidden')}
function loading(){app.innerHTML='<div class="wrap"><div class="spin"></div></div>'}
function qrURL(text){return 'https://api.qrserver.com/v1/create-qr-code/?size=320x320&margin=0&data='+encodeURIComponent(text)}

/* ---- auth: user/password ---- */
function signOut(){
  _token=null; _user=null; _name=null;
  localStorage.clear();
  setWho('');
  location.hash = '';
  route();  // re-render ทันที — ไม่พึ่ง hashchange (กรณีอยู่หน้า root อยู่แล้ว)
  toast('ออกจากระบบแล้ว');
}
function loginModal(){
  modal(`<h3>เข้าสู่ระบบครู</h3>
    <div class="field"><label>ชื่อผู้ใช้</label><input id="lg_u" autocomplete="username" placeholder="username"></div>
    <div class="field"><label>รหัสผ่าน</label><input id="lg_p" type="password" autocomplete="current-password" placeholder="••••••" onkeydown="if(event.key==='Enter')doLogin()"></div>
    <button class="btn primary block" id="lgBtn" onclick="doLogin()">เข้าสู่ระบบ</button>
    <p style="font-size:12.5px;color:var(--ink-soft);text-align:center;margin:12px 0 0">ยังไม่มีบัญชี? ติดต่อผู้ดูแลระบบเพื่อขอใช้งาน</p>`);
  setTimeout(()=>document.getElementById('lg_u')?.focus(),100);
}
async function doLogin(){
  const username=$('#lg_u').value.trim(), password=$('#lg_p').value;
  if(!username||!password)return toast('กรอกข้อมูลให้ครบ');
  $('#lgBtn').disabled=true;$('#lgBtn').textContent='กำลังเข้า…';
  try{
    const r=await api('/login',{method:'POST',json:{username,password},noAuth:true});
    _token=r.token;_user=r.username;_name=r.name;
    localStorage.setItem('kb_token',_token);localStorage.setItem('kb_user',_user);localStorage.setItem('kb_name',_name);
    closeModal();go('t');
  }catch(e){$('#lgBtn').disabled=false;$('#lgBtn').textContent='เข้าสู่ระบบ';toast(e.message)}
}

/* ---- router ---- */
async function route(){
  const [view,arg,arg2]=location.hash.slice(1).split('/');
  if(view==='t')return _token?teacherHome():landing();
  if(view==='board')return teacherBoard(arg);
  if(view==='new')return teacherNew();
  if(view==='share')return shareView(arg);
  if(view==='sum')return summaryView(arg);
  if(view==='s')return studentSubmit(arg);
  if(view==='r')return studentResult(arg);
  if(view==='p')return studentPeer(arg);
  return landing();
}
window.addEventListener('hashchange',route);

/* ============================================================ VIEWS */
function landing(){
  setWho(_token?('ครู · '+(_name||_user)):'');
  app.innerHTML=`<div class="wrap">
    <div class="hero">
      <h1>ส่งการบ้าน<br>ตรวจง่าย เห็น<span class="hl">ทั้งห้อง</span>ในจอเดียว</h1>
      <p>นักเรียนถ่ายรูปงานส่งได้ในไม่กี่วินาที ครูดูภาพรวมทั้งห้อง ให้คะแนนและเขียนความเห็นได้ทันที</p>
    </div>
    <div class="roles">
      <button class="role t" onclick="${_token?"go('t')":'loginModal()'}"><div class="ic">ค</div><h3>ฉันเป็นครู</h3><span>เข้าสู่ระบบด้วยชื่อผู้ใช้ เพื่อสร้างและตรวจกระดาน</span></button>
      <button class="role s" onclick="openStudentEntry()"><div class="ic">นร</div><h3>ฉันเป็นนักเรียน</h3><span>ส่งงาน หรือดูผลการตรวจของตนเอง</span></button>
    </div>
  </div>`;
}
function openStudentEntry(){
  modal(`<h3>เข้ากระดานของห้อง</h3>
    <div class="field"><label>รหัสกระดาน (จากครู)</label><input id="bc" placeholder="เช่น ab12cd" autocomplete="off"></div>
    <div style="font-size:13px;color:var(--ink-soft);margin:-6px 0 8px">เลือกว่าจะทำอะไร:</div>
    <div class="vsavebar" style="gap:8px">
      <button class="btn ghost block" onclick="closeModal()">ยกเลิก</button>
      <button class="btn block" style="background:var(--paper);border:1.5px solid var(--line)" onclick="enterBoard('r')">📋 ดูผลตรวจ</button>
      <button class="btn primary block" onclick="enterBoard('s')">📤 ส่งงาน</button>
    </div>`);
}
function enterBoard(mode){const c=$('#bc').value.trim();closeModal();if(c)go((mode||'s')+'/'+c)}

/* ---- teacher home ---- */
async function teacherHome(){
  setWho('ครู · '+(_name||_user));loading();
  let data;try{data=await api('/boards')}catch(e){return toast(e.message)}
  let cards='';
  for(const b of data.boards){
    const total=b.roster||b.submitted||0;
    const pct=total?Math.round(b.reviewed/total*100):0;
    const safeTitle=esc(b.title).replace(/'/g,"\\'");
    cards+=`<div class="bcard">
      <div class="bcard-acts">
        <button class="wbtn" title="ดาวน์โหลด zip" onclick="dlBoardZip('${b.id}','${safeTitle}',event)">⏬</button>
        <button class="wbtn del" title="ลบกระดาน" onclick="delBoard('${b.id}','${safeTitle}',event)">🗑</button>
      </div>
      <button class="bcard-open" onclick="go('board/${b.id}')">
        <span class="tag">${esc(b.room||'')}</span><h3>${esc(b.title)}</h3>
        <div class="meta">ส่งแล้ว ${b.submitted} ชิ้น · ตรวจแล้ว ${b.reviewed}</div>
        <div class="prog"><i style="width:${pct}%"></i></div>
        <div class="pnum"><span>ความคืบหน้าการตรวจ</span><span>${pct}%</span></div>
      </button></div>`;
  }
  app.innerHTML=`<div class="wrap"><div class="page">
    <div class="phead"><div><h2>กระดานของฉัน</h2><div class="sub">การบ้านแต่ละชิ้นคือกระดานหนึ่งใบ · มีเฉพาะของคุณ</div></div></div>
    <div class="grid"><button class="newcard" onclick="go('new')"><span class="plus">+</span>สร้างการบ้านใหม่</button>${cards}</div>
    ${data.boards.length?'':'<div class="empty"><div class="big">📋</div>ยังไม่มีกระดาน — เริ่มสร้างการบ้านชิ้นแรกได้ที่ปุ่มด้านบน</div>'}
  </div></div>`;
}

/* ---- teacher new ---- */

  if(!_token)return landing();
  setWho('ครู · '+(_name||_user));
  app.innerHTML=`<div class="wrap"><div class="page">
    <button class="back" onclick="go('t')">← กลับ</button><div class="phead"><h2>สร้างการบ้านใหม่</h2></div>
    <div style="max-width:460px">
      <div class="field"><label>ชื่อการบ้าน</label><input id="f_title" placeholder="เช่น ใบงานเศษส่วน บทที่ 3"></div>

      <div class="field"><div class="toggle" onclick="this.querySelector('.sw').classList.toggle('on')">
        <div class="lab">ให้นักเรียนเห็นงานของกัน<small>เปิด = กระดานแชร์ · ปิด = เห็นเฉพาะงานตัวเอง</small></div><div class="sw" id="f_peer"></div></div></div>

/* ---- marking board ---- */
let _filter='all',_subsCache=[],_currentBoardId=null,_currentBoardTitle='';
async function teacherBoard(id){
  _currentBoardId=id;
  if(!_token)return landing();
  setWho('ครู · '+(_name||_user));loading();
  let data;try{data=await api('/boards/'+id+'/subs')}catch(e){return toast(e.message)||go('t')}
  _subsCache=data.subs;
  _currentBoardTitle=data.board?.title||'';
  let subs=data.subs;
  const counts={all:subs.length,wait:subs.filter(s=>s.status==='wait').length,done:subs.filter(s=>s.status!=='wait').length};
  let show=subs;
  if(_filter==='wait')show=subs.filter(s=>s.status==='wait');
  if(_filter==='done')show=subs.filter(s=>s.status!=='wait');
  const seg=(k,l)=>`<button class="${_filter===k?'on':''}" onclick="setFilter('${k}','${id}')">${l}</button>`;
  let cells='';
  show.forEach(s=>{
    const idx=subs.indexOf(s);
    const badge=s.status==='ok'?'<div class="badge ok">✓</div>':s.status==='no'?'<div class="badge no">✕</div>':s.status==='star'?'<div class="badge star">★</div>':'';
    const ring=s.status==='wait'?'<div class="pending-ring"></div>':'';
    const imgs=subImgs(s);
    cells+=`<div class="work">${ring}${badge}

function downloadImgs(s){

/* ดาวน์โหลดทั้งกระดานเป็น zip (รูป + CSV สรุปคะแนน) */
async function dlBoardZip(boardId,title,ev){
  if(ev){ev.stopPropagation();ev.preventDefault()}
  if(typeof JSZip==='undefined')return toast('โหลด JSZip ไม่สำเร็จ ลองใหม่อีกครั้ง');
  toast('กำลังเตรียมไฟล์ zip…');
  try{
    // ดึงข้อมูล subs ของกระดาน
    const data=await api('/boards/'+boardId+'/subs');
    const subs=data.subs||[];
    if(subs.length===0)return toast('กระดานนี้ยังไม่มีงานส่ง');

    const zip=new JSZip();
    // CSV สรุปคะแนน
    const stMap={ok:'✓ ถูก',no:'✕ ผิด',star:'★ ดีเด่น',wait:'ยังไม่ตรวจ'};
    let csv='\uFEFFเลขที่,ชื่อ,สถานะ,คะแนน,จำนวนรูป,หมายเหตุ\n';
    subs.forEach(s=>{
      const row=[s.no,'"'+(s.name||'').replace(/"/g,'""')+'"',stMap[s.status]||s.status,s.score??'',subImgs(s).length,'"'+(s.comment||'').replace(/"/g,'""')+'"'];
      csv+=row.join(',')+'\n';
    });
    zip.file('สรุปคะแนน.csv',csv);

    // ดาวน์โหลดรูปทีละคน (concurrent 4 คนเพื่อกัน rate limit) — หนึ่งคนอาจมีหลายรูป
    let done=0;
    async function fetchOne(s){
      const imgs=subImgs(s);
      const base=`เลขที่${s.no}${s.name?'-'+s.name:''}`;
      for(let i=0;i<imgs.length;i++){
        try{
          const res=await fetch(imgs[i]);if(!res.ok)throw new Error('fetch '+res.status);
          zip.file(imgs.length>1?`${base}-${i+1}.${urlExt(imgs[i])}`:`${base}.${urlExt(imgs[i])}`,await res.blob());
        }catch(e){console.warn('skip',s.no,i+1,e.message)}
      }
      done++;
      if(done%5===0||done===subs.length)toast(`กำลังโหลด ${done}/${subs.length}…`);
    }
    // run in batches of 4
    for(let i=0;i<subs.length;i+=4){
      await Promise.all(subs.slice(i,i+4).map(fetchOne));
    }

    toast('กำลังสร้าง zip…');
    const blob=await zip.generateAsync({type:'blob',compression:'DEFLATE',compressionOptions:{level:6}});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');a.href=url;a.download=(title||'กระดาน').replace(/[/\\?%*:|"<>]/g,'_')+'.zip';
    document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),5000);
    toast('ดาวน์โหลดเรียบร้อย ✓');
  }catch(e){toast('ผิดพลาด: '+e.message)}
}

let _vCtx=null;
let _zoom={scale:1,x:0,y:0,dragging:false,startX:0,startY:0,startTx:0,startTy:0,pinchDist:0,pinchStartScale:1};
function _zoomReset(){_zoom.scale=1;_zoom.x=0;_zoom.y=0;_zoomApply()}
function _zoomApply(){
  const img=document.querySelector('.vstage img');const stage=document.querySelector('.vstage');
  if(!img||!stage)return;
  // ที่ scale=1 ให้ pan reset อัตโนมัติ (รูปอยู่กึ่งกลาง)
  if(Math.abs(_zoom.scale-1)<0.01){_zoom.x=0;_zoom.y=0;stage.classList.remove('zoomed')}
  else{stage.classList.add('zoomed')}
  img.style.transform=`translate(${_zoom.x}px,${_zoom.y}px) scale(${_zoom.scale})`;
  const lbl=document.getElementById('vzLbl');if(lbl)lbl.textContent=Math.round(_zoom.scale*100)+'%';
}
function vzIn(){_zoom.scale=Math.min(5,_zoom.scale*1.4);_zoomApply()}
function vzOut(){_zoom.scale=Math.max(0.3,_zoom.scale/1.4);_zoomApply()}
function vzReset(){_zoomReset()}
function vzDownload(){downloadImgs(_vCtx.subs[_vCtx.idx])}
async function vzDelete(){
  const s=_vCtx.subs[_vCtx.idx];
  if(!confirm(`ลบงานของเลขที่ ${s.no}${s.name?' ('+s.name+')':''}?\nทำแล้วไม่สามารถกู้คืนได้`))return;
  try{await api('/subs/'+s.id,{method:'DELETE'});toast('ลบแล้ว');
    // ลบออกจาก cache + นำทางต่อ
    _vCtx.subs.splice(_vCtx.idx,1);
    _subsCache=_vCtx.subs;
    if(_vCtx.subs.length===0){closeViewer();return}
    if(_vCtx.idx>=_vCtx.subs.length)_vCtx.idx=_vCtx.subs.length-1;
    _vCtx.i=0;renderViewer();
  }catch(e){toast(e.message)}
}
function _vstageBind(){
  const stage=document.querySelector('.vstage');const wrap=document.querySelector('.vimg-wrap');
  if(!stage||!wrap)return;
  // pan (mouse + 1-finger touch)
  const start=(x,y)=>{_zoom.dragging=true;_zoom.startX=x;_zoom.startY=y;_zoom.startTx=_zoom.x;_zoom.startTy=_zoom.y;wrap.classList.add('grabbing')};
  const move=(x,y)=>{if(!_zoom.dragging)return;_zoom.x=_zoom.startTx+(x-_zoom.startX);_zoom.y=_zoom.startTy+(y-_zoom.startY);_zoomApply()};
  const end=()=>{_zoom.dragging=false;wrap.classList.remove('grabbing')};
  wrap.onmousedown=e=>{e.preventDefault();start(e.clientX,e.clientY)};
  window.onmousemove=e=>{if(_zoom.dragging)move(e.clientX,e.clientY)};
  window.onmouseup=end;
  // touch: 1-finger = pan, 2-finger = pinch
  wrap.ontouchstart=e=>{
    if(e.touches.length===2){
      const dx=e.touches[0].clientX-e.touches[1].clientX,dy=e.touches[0].clientY-e.touches[1].clientY;
      _zoom.pinchDist=Math.hypot(dx,dy);_zoom.pinchStartScale=_zoom.scale;
    }else if(e.touches.length===1){start(e.touches[0].clientX,e.touches[0].clientY)}
  };
  wrap.ontouchmove=e=>{
    if(e.touches.length===2){
      e.preventDefault();
      const dx=e.touches[0].clientX-e.touches[1].clientX,dy=e.touches[0].clientY-e.touches[1].clientY;
      const d=Math.hypot(dx,dy);
      if(_zoom.pinchDist>0)_zoom.scale=Math.max(0.3,Math.min(5,_zoom.pinchStartScale*(d/_zoom.pinchDist)));
      _zoomApply();
    }else if(e.touches.length===1&&_zoom.dragging){e.preventDefault();move(e.touches[0].clientX,e.touches[0].clientY)}
  };
  wrap.ontouchend=end;
  // double-click/tap = toggle zoom 1x ↔ 2.5x
  wrap.ondblclick=()=>{if(_zoom.scale>1)_zoomReset();else{_zoom.scale=2.5;_zoomApply()}};
}

  let el=document.getElementById('viewer');
  if(!el){el=document.createElement('div');el.id='viewer';el.className='viewer';document.body.appendChild(el)}
  el.innerHTML=`<div class="vtop"><div><div class="vname">เลขที่ ${s.no}${s.name?' · '+esc(s.name):''}</div><div class="vsub">${_pvIdx+1} / ${subs.length}${imgs.length>1?` · รูปที่ ${_pvImg+1} / ${imgs.length}`:''}</div></div><button class="vclose" onclick="closePeerViewer()">✕</button></div>
    ${imgs.length>1?`<div class="vstrip">${imgs.map((u,i)=>`<button class="${i===_pvImg?'on':''}" onclick="pvSel(${i})"><img src="${u}" alt=""></button>`).join('')}</div>`:''}
    <div class="vstage">
      <button class="varrow l" ${_pvIdx===0?'disabled':''} onclick="pvNav(-1)">‹</button>
      <div class="vimg-wrap"><img src="${imgs[_pvImg]||''}" alt=""></div>
      <button class="varrow r" ${_pvIdx===subs.length-1?'disabled':''} onclick="pvNav(1)">›</button>
      <div class="vzoom">
        <button onclick="vzOut()" title="ย่อ">−</button>
        <div class="vzlabel" id="vzLbl">100%</div>
        <button onclick="vzIn()" title="ขยาย">+</button>
        <button onclick="vzReset()" title="พอดี">⊙</button>
      </div>
    </div>`;
  document.body.style.overflow='hidden';
  setTimeout(_vstageBind,30);
}
function pvNav(d){const n=_pvIdx+d;if(n<0||n>=window._peerSubs.length)return;_pvIdx=n;_pvImg=0;renderPeerViewer()}
function pvSel(i){_pvImg=i;renderPeerViewer()}
function closePeerViewer(){const el=document.getElementById('viewer');if(el)el.remove();document.body.style.overflow=''}

/* ---- student submit ---- */
// รูปที่เลือกไว้แต่ยังไม่ส่ง: [{file, out:{std:{blob,kb,url}, art:{...}}}]
// เก็บ File ต้นฉบับไว้ด้วย เพื่อให้สลับโหมดแล้วบีบใหม่จากของเดิมได้ (File เป็นแค่ handle ไม่กิน RAM)
let _pendingShots=[];
const shotOut = s => s.out[_imgMode];
function freeShot(s){Object.values(s.out).forEach(o=>URL.revokeObjectURL(o.url))}
function clearShots(){_pendingShots.forEach(freeShot);_pendingShots=[]}
async function studentSubmit(id){
  setWho('');loading();
  let b;try{b=await api('/board/'+id,{noAuth:true})}catch(e){
    app.innerHTML=`<div class="wrap"><div class="empty" style="padding-top:80px"><div class="big">🔍</div>ไม่พบกระดานนี้<br><button class="btn sm" style="margin-top:14px" onclick="go('')">กลับหน้าแรก</button></div></div>`;return}
  if(b.max_imgs>0)MAX_IMGS=b.max_imgs;   // ยึดเพดานจาก backend เสมอ
  clearShots();_imgMode='std';           // เปิดหน้าใหม่ทีไร กลับไปโหมดมาตรฐานเสมอ
    app.innerHTML=`<div class="wrap"><div class="page"><div class="scard">
    <div style="display:flex;align-items:center;gap:8px;margin-bottom:4px;flex-wrap:wrap">
      <button class="btn sm" onclick="go('')">← กลับ</button>
      ${b.peer?`<button class="btn sm" onclick="go('p/${id}')">👥 ดูงานเพื่อน</button>`:''}
      <button class="btn sm" style="margin-left:auto" onclick="go('r/${id}')">📋 ดูผลการตรวจ</button>
    </div>
    <div class="stask"><div class="tag">ส่งการบ้าน</div><h2>${esc(b.title)}</h2><div class="rm">${esc(b.room||'')}</div></div>
    <div class="field"><label>เลขที่</label><input id="s_no" type="number" inputmode="numeric" placeholder="เช่น 12"></div>
    <div class="field"><label>ชื่อ - สกุล</label><input id="s_name" placeholder="เช่น สมชาย ใจดี"></div>
    <div class="field"><label>รูปงาน (แนบได้สูงสุด ${MAX_IMGS} รูป)</label>
      <div class="modes" id="modeRow"></div>
      <div class="shots" id="shots"></div>
      <div class="pickrow" id="pickrow">
        <label class="pickbtn"><input type="file" accept="image/*" capture="environment" style="display:none" onchange="pickImg(this)"><span class="ic">📷</span>ถ่ายรูป</label>
        <label class="pickbtn"><input type="file" accept="image/*" multiple style="display:none" onchange="pickImg(this)"><span class="ic">🖼</span>เลือกจากเครื่อง</label>
      </div>
      <div class="shotinfo" id="shotinfo"></div>
    </div>
    <button class="btn primary block" id="subBtn" onclick="submitWork('${id}')">ส่งงาน</button>
  </div></div></div>`;
  renderShots();
}
function renderShots(){
  const g=$('#shots'),info=$('#shotinfo'),row=$('#pickrow'),mr=$('#modeRow');
  if(!g||!info||!row)return;
  // โชว์ขนาดรวมข้างโหมดที่บีบไว้แล้ว นักเรียนจะได้เทียบเห็นเลขจริงโดยไม่ต้องกดสลับไปมา
  if(mr)mr.innerHTML=Object.keys(IMG_MODES).map(k=>{const m=IMG_MODES[k];
    const ready=_pendingShots.length&&_pendingShots.every(s=>s.out[k]);
    const kb=ready?_pendingShots.reduce((a,s)=>a+s.out[k].kb,0):null;
    return `<button type="button" class="modebtn${k===_imgMode?' on':''}" onclick="setImgMode('${k}')">
      <span class="t"><b>${m.icon||''}${m.label}${m.rec?`<i class="rec">${m.rec}</i>`:''}</b>
      <span>${m.hint}</span></span>
      ${kb!==null?`<span class="kb">${fmtKB(kb)}</span>`:''}
    </button>`}).join('');
  g.innerHTML=_pendingShots.map((s,i)=>{const o=shotOut(s);return `<div class="shot">
    <img src="${o?o.url:''}" alt="">
    <button class="rm" title="นำรูปนี้ออก" onclick="removeShot(${i})">✕</button>
    <span class="ord">${i+1}</span>
  </div>`}).join('');
  row.classList.toggle('off',_pendingShots.length>=MAX_IMGS);
  if(!_pendingShots.length){info.textContent='ยังไม่ได้แนบรูป — ต้องแนบอย่างน้อย 1 รูป';return}
  // ขนาดของแต่ละโหมดโชว์อยู่บนปุ่มแล้ว ตรงนี้เหลือแค่ยอดรวมของโหมดที่เลือกอยู่ + คำเตือนโหมดศิลปะ
  const kb=_pendingShots.reduce((a,s)=>a+(shotOut(s)?.kb||0),0);
  const head=`แนบแล้ว <b>${_pendingShots.length}</b> / ${MAX_IMGS} รูป · รวม <b>${fmtKB(kb)}</b>`;
  info.innerHTML=_imgMode==='art'
    ? head+`<span class="warn">โหมดงานศิลปะไฟล์ใหญ่กว่าปกติหลายเท่า ทำให้พื้นที่เก็บงานเต็มเร็วขึ้น — เลือกเมื่อครูสั่งงานที่ต้องดูสีและรายละเอียดจริง ๆ</span>`
    : head;
}
async function setImgMode(m){
  if(m===_imgMode||!IMG_MODES[m])return;
  _imgMode=m;
  const info=$('#shotinfo');
  if(info&&_pendingShots.some(s=>!s.out[m]))info.textContent='กำลังแปลงรูปใหม่…';
  for(const s of _pendingShots){
    if(s.out[m])continue;
    try{const o=await compress(s.file,m);o.url=URL.createObjectURL(o.blob);s.out[m]=o}
    catch(e){toast(e.message)}
  }
  renderShots();
}
function removeShot(i){
  const s=_pendingShots[i];if(!s)return;
  freeShot(s);_pendingShots.splice(i,1);renderShots();
}
async function pickImg(input){
  const files=[...input.files];input.value='';   // เคลียร์ค่า เพื่อให้เลือกไฟล์เดิมซ้ำได้
  if(!files.length)return;
  const room=MAX_IMGS-_pendingShots.length;
  if(room<=0)return toast(`แนบรูปได้สูงสุด ${MAX_IMGS} รูป`);
  if(files.length>room)toast(`แนบได้อีก ${room} รูป — ระบบรับเฉพาะ ${room} รูปแรก`);
  const info=$('#shotinfo');if(info)info.textContent='กำลังย่อรูป…';
  for(const f of files.slice(0,room)){
    try{
      const o=await compress(f);
      o.url=URL.createObjectURL(o.blob);
      _pendingShots.push({file:f,out:{[_imgMode]:o}});
    }catch(e){toast(e.message)}
  }
  renderShots();
}
async function submitWork(id){
  const no=$('#s_no').value.trim();if(!no)return toast('กรุณากรอกเลขที่');
  const name=$('#s_name').value.trim();if(!name)return toast('กรุณากรอกชื่อ - สกุล');
  if(!_pendingShots.length)return toast('กรุณาแนบรูปงานอย่างน้อย 1 รูป');
  const n=_pendingShots.length;
  if(_pendingShots.some(s=>!shotOut(s)))return toast('ยังแปลงรูปไม่เสร็จ รอสักครู่แล้วลองใหม่');
  $('#subBtn').disabled=true;$('#subBtn').textContent=`กำลังส่ง ${n} รูป…`;
  const fd=new FormData();fd.append('board',id);fd.append('no',no);fd.append('name',name);
  _pendingShots.forEach((s,i)=>fd.append('file',shotOut(s).blob,`work-${i+1}.${imgExt()}`));
  try{await api('/submit',{method:'POST',body:fd,noAuth:true})}
  catch(e){$('#subBtn').disabled=false;$('#subBtn').textContent='ส่งงาน';return toast(e.message)}
  clearShots();
  app.innerHTML=`<div class="wrap"><div class="page"><div class="result">
    <div style="display:flex;align-items:center;gap:8px;margin-bottom:4px;">
      <button class="btn sm" onclick="go('')">← กลับหน้าแรก</button>
    </div>
    <div style="font-size:60px;margin-top:30px">🎉</div><h2 style="margin:6px 0">ส่งงานเรียบร้อย</h2>
    <p style="color:var(--ink-soft)">เลขที่ ${no} · ${esc(name)} · ${n} รูป</p>
    <button class="btn primary block" style="margin-top:20px;max-width:300px;margin-inline:auto" onclick="go('r/${id}')">ดูผลการตรวจ (เมื่อครูตรวจแล้ว)</button>
    <button class="btn ghost block" style="margin-top:8px;max-width:300px;margin-inline:auto" onclick="go('s/${id}')">ส่งงานอีกครั้ง / ส่งแทนผู้อื่น</button>
  </div></div></div>`;
}

/* ---- student result ---- */
async function studentResult(id){
  setWho('');
  // เช็คว่ากระดานนี้ peer หรือเปล่า (silent fail ถ้าไม่มี)
  let peerBtn='';
  try{const b=await api('/board/'+id,{noAuth:true});if(b.peer)peerBtn=`<button class="btn sm" onclick="go('p/${id}')">👥 ดูงานเพื่อน</button>`}catch(e){}
  app.innerHTML=`<div class="wrap"><div class="page"><div class="result">
    <div style="display:flex;align-items:center;gap:8px;margin-bottom:4px;flex-wrap:wrap">
      <button class="btn sm" onclick="go('')">← กลับ</button>
      ${peerBtn}
      <button class="btn sm" style="margin-left:auto" onclick="go('s/${id}')">📤 ไปส่งงาน</button>
    </div>
    <div class="phead" style="justify-content:center"><h2>ดูผลการตรวจ</h2></div>
    <div class="field" style="max-width:240px;margin:0 auto"><label>เลขที่</label><input id="r_no" type="number" inputmode="numeric" placeholder="เช่น 12"></div>
    <button class="btn primary" style="margin-top:6px" onclick="showResult('${id}')">ดูผล</button><div id="rOut"></div></div></div></div>`;
}
async function showResult(id){
  const no=$('#r_no').value.trim();if(!no)return toast('กรุณากรอกเลขที่');
  const out=$('#rOut');out.innerHTML='<div class="spin"></div>';
  let s;try{s=await api('/result/'+id+'/'+no,{noAuth:true})}catch(e){out.innerHTML=`<div class="empty" style="padding:30px"><div class="big">🤔</div>${esc(e.message)}</div>`;return}
  const pics=subImgs(s).map(u=>`<img src="${u}" alt="">`).join('');
  if(s.status==='wait'){out.innerHTML=`<div class="rsheet">${pics}<div style="padding:18px"><div style="font-size:34px">⏳</div><div style="font-weight:600">ครูยังไม่ได้ตรวจงานนี้</div><div style="font-size:13px;color:var(--ink-soft)">กรุณาตรวจสอบอีกครั้งภายหลัง</div></div></div>`;return}
  const stamp=s.status==='ok'?'✅':s.status==='no'?'❌':'⭐';
  out.innerHTML=`<div class="rsheet">${pics}<div class="rstamp">${stamp}</div>
    ${s.score!=null&&s.score!==''?`<div class="rscore">${esc(String(s.score))} คะแนน</div>`:''}
    ${s.comment?`<div class="rcomment">${esc(s.comment)}</div>`:'<div style="height:14px"></div>'}</div>`;
}

/* ---- modal ---- */
function modal(html){let m=document.createElement('div');m.className='modal-bg';m.id='mbg';m.onclick=e=>{if(e.target===m)closeModal()};m.innerHTML=`<div class="modal">${html}</div>`;document.body.appendChild(m)}
function closeModal(){const m=$('#mbg');if(m)m.remove()}

route();
</script>
