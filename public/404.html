<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light">
<title>ไม่พบหน้านี้ — Kru-ti ครูติ TH</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/x-icon" href="/favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pridi:wght@600;700&family=Sarabun:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#101c33;--gold:#f3ac2e;--gold-deep:#c47f0e;--gold-soft:rgba(243,172,46,.13);
--paper:#faf7f1;--line:#e8e1d3;--slate:#6d7588;}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Sarabun',sans-serif;background:var(--paper);color:var(--ink);
  min-height:100vh;display:flex;flex-direction:column;-webkit-font-smoothing:antialiased;}
nav{background:var(--ink);height:62px;padding:0 22px;display:flex;align-items:center;}
.logo{font-family:'Pridi',serif;font-size:1.15rem;font-weight:700;color:#fff;
  text-decoration:none;display:flex;align-items:center;gap:9px;}
.logo-mark{width:34px;height:34px;border-radius:10px;
  background:linear-gradient(135deg,var(--gold),var(--gold-deep));
  display:flex;align-items:center;justify-content:center;color:var(--ink);font-size:1rem;}
.logo em{font-style:normal;font-size:.65rem;color:#7587a5;align-self:flex-start;margin-top:2px;}
main{flex:1;display:flex;align-items:center;justify-content:center;padding:50px 20px;}
.box{text-align:center;max-width:520px;}
.mark{font-family:'Pridi',serif;font-size:4.4rem;font-weight:700;color:var(--ink);line-height:1;}
.mark span{color:var(--gold);}
h1{font-family:'Pridi',serif;font-size:1.5rem;font-weight:600;margin:14px 0 8px;}
p{color:var(--slate);font-size:.95rem;line-height:1.8;margin-bottom:26px;}
.links{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;}
.links a{background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:11px 20px;
  text-decoration:none;color:var(--ink);font-weight:700;font-size:.9rem;transition:border-color .15s;}
.links a:hover{border-color:var(--gold);}
.links a.main{background:var(--gold);border-color:var(--gold);color:var(--ink);}
footer{background:var(--ink);color:rgba(255,255,255,.72);padding:22px;text-align:center;font-size:.85rem;}
footer a{color:#ffc555;text-decoration:none;font-weight:700;}
</style>
</head>
<body>
<nav>
  <a class="logo" href="/"><span class="logo-mark">✦</span>Kru-ti ครูติ <em>TH</em></a>
</nav>
<main>
  <div class="box">
    <div class="mark">4<span>✦</span>4</div>
    <h1>ไม่พบหน้าที่ต้องการ</h1>
    <p>ลิงก์อาจพิมพ์ผิด หรือหน้านี้ถูกย้ายไปแล้ว<br>ลองเริ่มจากหน้าเหล่านี้ดูครับ</p>
    <div class="links">
      <a class="main" href="/">หน้าหลัก</a>
      <a href="/#/blog">บทความ</a>
      <a href="/apps">แอปทั้งหมด</a>
      <a href="/worksheets">ใบงาน</a>
      <a href="/#/report">แจ้งปัญหา</a>
    </div>
  </div>
</main>
<footer>
  <a href="/">Kru-ti ครูติ TH</a> — แอปการสอนและบทความ เพื่อครูไทย · © 2568
</footer>
<script>
// เว็บหลักเป็น SPA ที่ใช้ hash routing — บางหน้าจึงไม่มี path จริง
// ถ้าคนพิมพ์ /blog หรือ /about มาตรง ๆ ให้พาไปหน้าที่ถูกต้องแทนที่จะให้เจอ 404 เปล่า ๆ
// (crawler ยังได้สถานะ 404 ตามปกติ — หน้าพวกนี้อยู่หลัง # จึงไม่ได้ตั้งใจให้ index อยู่แล้ว)
(function () {
  var map = {
    '/blog': '/#/blog', '/about': '/#/about', '/buy': '/#/buy',
    '/report': '/#/report', '/privacy': '/#/privacy'
  };
  var to = map[location.pathname.replace(/\/+$/, '') || '/'];
  if (to) location.replace(to);
})();
</script>
</body>
</html>
